<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanwar - Onboarding Tour</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Demo Content - Remove in production */
        .demo-content {
            text-align: center;
            padding: 40px 20px;
        }

        .demo-content h1 {
            color: #1f2937;
            font-size: 32px;
            margin-bottom: 16px;
        }

        .demo-content p {
            color: #6b7280;
            font-size: 18px;
            margin-bottom: 32px;
        }

        .start-tour-btn {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .start-tour-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(79, 70, 229, 0.3);
        }

        /* Onboarding Tour Styles */
        .onboarding-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(2px);
            z-index: 9998;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease-out;
        }

        .onboarding-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .onboarding-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: white;
            border-radius: 16px;
            padding: 24px;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            z-index: 9999;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .onboarding-modal.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* Header */
        .onboarding-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .onboarding-step-counter {
            font-size: 14px;
            color: #6b7280;
            font-weight: 500;
        }

        .onboarding-close-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            border-radius: 6px;
            color: #6b7280;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .onboarding-close-btn:hover {
            background: #f3f4f6;
            color: #374151;
        }

        /* Progress Bar */
        .onboarding-progress-container {
            width: 100%;
            height: 4px;
            background: #e5e7eb;
            border-radius: 2px;
            margin-bottom: 24px;
            overflow: hidden;
        }

        .onboarding-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
            border-radius: 2px;
            transition: width 0.3s ease;
            position: relative;
        }

        .onboarding-progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            animation: shimmer 2s infinite;
        }

        /* Content */
        .onboarding-content {
            margin-bottom: 24px;
            text-align: center;
        }

        .onboarding-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 28px;
        }

        .onboarding-title {
            font-size: 20px;
            font-weight: 600;
            color: #111827;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .onboarding-description {
            font-size: 15px;
            color: #6b7280;
            line-height: 1.5;
            margin: 0;
        }

        /* Footer */
        .onboarding-footer {
            border-top: 1px solid #e5e7eb;
            padding-top: 20px;
        }

        .onboarding-navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .onboarding-nav-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            background: white;
            color: #374151;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 80px;
            justify-content: center;
        }

        .onboarding-nav-btn:hover {
            background: #f9fafb;
            border-color: #9ca3af;
        }

        .onboarding-nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .onboarding-primary-btn {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            border: none;
            border-color: transparent;
        }

        .onboarding-primary-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(79, 70, 229, 0.3);
            background: linear-gradient(135deg, #4338ca, #6d28d9);
        }

        /* Dots Navigation */
        .onboarding-dots {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .onboarding-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #d1d5db;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .onboarding-dot.active {
            background: #4f46e5;
            transform: scale(1.2);
        }

        .onboarding-dot.completed {
            background: #10b981;
        }

        .onboarding-dot:hover {
            transform: scale(1.1);
        }

        /* Animations */
        @keyframes shimmer {
            0% { background-position: -200px 0; }
            100% { background-position: calc(200px + 100%) 0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translate(-50%, -30%) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        /* Mobile Responsiveness */
        @media (max-width: 640px) {
            .onboarding-modal {
                max-width: 350px;
                padding: 20px;
                margin: 20px;
            }
            
            .onboarding-title {
                font-size: 18px;
            }
            
            .onboarding-description {
                font-size: 14px;
            }
            
            .onboarding-navigation {
                flex-direction: column;
                gap: 12px;
            }
            
            .onboarding-nav-btn {
                width: 100%;
            }

            .onboarding-dots {
                order: -1;
                margin-bottom: 12px;
            }
        }

        /* Dark Mode Support */
        @media (prefers-color-scheme: dark) {
            body {
                background: #111827;
                color: white;
            }

            .demo-content h1 {
                color: #f9fafb;
            }

            .onboarding-modal {
                background: #1f2937;
                color: white;
            }
            
            .onboarding-title {
                color: #f9fafb;
            }
            
            .onboarding-description {
                color: #d1d5db;
            }
            
            .onboarding-close-btn:hover {
                background: #374151;
                color: #d1d5db;
            }
            
            .onboarding-footer {
                border-top-color: #374151;
            }

            .onboarding-nav-btn {
                background: #374151;
                color: #d1d5db;
                border-color: #4b5563;
            }

            .onboarding-nav-btn:hover {
                background: #4b5563;
                border-color: #6b7280;
            }
        }
    </style>
</head>
<body>
    <!-- Demo Content - Replace with your actual app content -->
    <div class="demo-content">
        <h1>Welcome to Sanwar</h1>
        <p>Your smart salon booking platform</p>
        <button class="start-tour-btn" onclick="startOnboardingTour()">Start Tour (Demo)</button>
        <br><br>
        <button class="start-tour-btn" onclick="simulateSignup()" style="background: linear-gradient(135deg, #10b981, #059669);">
            Simulate New User Signup
        </button>
        <br><br>
        <button class="start-tour-btn" onclick="resetOnboardingStatus()" style="background: linear-gradient(135deg, #ef4444, #dc2626);">
            Reset Onboarding Status
        </button>
    </div>

    <!-- Onboarding Tour -->
    <div id="onboarding-overlay" class="onboarding-overlay" onclick="handleOverlayClick(event)">
        <div id="onboarding-modal" class="onboarding-modal">
            <!-- Header -->
            <div class="onboarding-header">
                <div class="onboarding-step-counter">
                    <span id="step-counter">Step 1 of 5</span>
                </div>
                <button class="onboarding-close-btn" onclick="skipOnboarding()" title="Skip tour">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <!-- Progress Bar -->
            <div class="onboarding-progress-container">
                <div id="progress-bar" class="onboarding-progress-bar" style="width: 20%;"></div>
            </div>

            <!-- Content -->
            <div class="onboarding-content">
                <div id="step-icon" class="onboarding-icon">
                    🎉
                </div>
                <h3 id="step-title" class="onboarding-title">
                    Welcome to Sanwar!
                </h3>
                <p id="step-description" class="onboarding-description">
                    Discover and book appointments at the best salons near you. Let's get you started with a quick tour!
                </p>
            </div>

            <!-- Footer -->
            <div class="onboarding-footer">
                <div class="onboarding-navigation">
                    <button id="prev-btn" class="onboarding-nav-btn" onclick="previousStep()" disabled>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 12H5M12 19l-7-7 7-7"/>
                        </svg>
                        Previous
                    </button>
                    
                    <div id="dots-container" class="onboarding-dots">
                        <!-- Dots will be generated dynamically -->
                    </div>
                    
                    <button id="next-btn" class="onboarding-nav-btn onboarding-primary-btn" onclick="nextStep()">
                        Next
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M5 12h14M12 5l7 7-7 7"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Onboarding Tour Configuration
        const onboardingSteps = [
            {
                id: 'welcome',
                title: 'Welcome to Sanwar!',
                description: 'Discover and book appointments at the best salons near you. Let\'s get you started with a quick tour!',
                icon: '🎉'
            },
            {
                id: 'browse',
                title: 'Browse Featured Salons',
                description: 'Explore popular salons in your area. Each salon shows ratings, services, and real-time availability.',
                icon: '💼'
            },
            {
                id: 'search',
                title: 'Search for Salons',
                description: 'Use the search functionality to find specific salons by name, location, or services offered.',
                icon: '🔍'
            },
            {
                id: 'booking',
                title: 'Easy Booking Process',
                description: 'Click on any salon to view services, select time slots, and book instantly with confirmation.',
                icon: '📅'
            },
            {
                id: 'profile',
                title: 'Manage Your Profile',
                description: 'Access your bookings, update profile, payment methods, and manage preferences from your account.',
                icon: '👤'
            }
        ];

        let currentStep = 0;
        let tourStarted = false;

        // Initialize the tour
        function initializeTour() {
            generateDots();
            updateStepContent();
        }

        // Generate navigation dots
        function generateDots() {
            const dotsContainer = document.getElementById('dots-container');
            dotsContainer.innerHTML = '';
            
            onboardingSteps.forEach((step, index) => {
                const dot = document.createElement('div');
                dot.className = 'onboarding-dot';
                dot.onclick = () => goToStep(index);
                dotsContainer.appendChild(dot);
            });
            
            updateDots();
        }

        // Update navigation dots
        function updateDots() {
            const dots = document.querySelectorAll('.onboarding-dot');
            dots.forEach((dot, index) => {
                dot.classList.remove('active', 'completed');
                if (index === currentStep) {
                    dot.classList.add('active');
                } else if (index < currentStep) {
                    dot.classList.add('completed');
                }
            });
        }

        // Update step content
        function updateStepContent() {
            const stepData = onboardingSteps[currentStep];
            const progress = ((currentStep + 1) / onboardingSteps.length) * 100;

            // Update content
            document.getElementById('step-counter').textContent = `Step ${currentStep + 1} of ${onboardingSteps.length}`;
            document.getElementById('progress-bar').style.width = `${progress}%`;
            document.getElementById('step-icon').textContent = stepData.icon;
            document.getElementById('step-title').textContent = stepData.title;
            document.getElementById('step-description').textContent = stepData.description;

            // Update navigation buttons
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            
            prevBtn.disabled = currentStep === 0;
            
            if (currentStep === onboardingSteps.length - 1) {
                nextBtn.innerHTML = `
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 6L9 17l-5-5"/>
                    </svg>
                    Complete
                `;
            } else {
                nextBtn.innerHTML = `
                    Next
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                `;
            }

            updateDots();
        }

        // Start the onboarding tour
        function startOnboardingTour() {
            currentStep = 0;
            tourStarted = true;
            initializeTour();
            
            const overlay = document.getElementById('onboarding-overlay');
            const modal = document.getElementById('onboarding-modal');
            
            overlay.classList.add('active');
            
            // Small delay for smooth animation
            setTimeout(() => {
                modal.classList.add('active');
            }, 100);

            // Prevent body scroll
            document.body.style.overflow = 'hidden';
        }

        // Go to next step
        function nextStep() {
            if (currentStep < onboardingSteps.length - 1) {
                currentStep++;
                updateStepContent();
                
                // Add subtle animation
                const modal = document.getElementById('onboarding-modal');
                modal.style.transform = 'translate(-50%, -50%) scale(0.98)';
                setTimeout(() => {
                    modal.style.transform = 'translate(-50%, -50%) scale(1)';
                }, 100);
            } else {
                completeOnboarding();
            }
        }

        // Go to previous step
        function previousStep() {
            if (currentStep > 0) {
                currentStep--;
                updateStepContent();
                
                // Add subtle animation
                const modal = document.getElementById('onboarding-modal');
                modal.style.transform = 'translate(-50%, -50%) scale(0.98)';
                setTimeout(() => {
                    modal.style.transform = 'translate(-50%, -50%) scale(1)';
                }, 100);
            }
        }

        // Go to specific step
        function goToStep(stepIndex) {
            if (stepIndex >= 0 && stepIndex < onboardingSteps.length) {
                currentStep = stepIndex;
                updateStepContent();
                
                // Add subtle animation
                const modal = document.getElementById('onboarding-modal');
                modal.style.transform = 'translate(-50%, -50%) scale(0.98)';
                setTimeout(() => {
                    modal.style.transform = 'translate(-50%, -50%) scale(1)';
                }, 100);
            }
        }

        // Complete the onboarding tour
        function completeOnboarding() {
            // Save completion status - this prevents it from showing again
            localStorage.setItem('sanwar_onboarding_completed', 'completed');
            localStorage.setItem('sanwar_onboarding_completed_at', new Date().toISOString());
            
            // Clean up any signup flags
            localStorage.removeItem('sanwar_just_signed_up');
            
            closeTour();
            
            // You can add success message or redirect here
            setTimeout(() => {
                alert('🎉 Welcome to Sanwar! You\'re all set to start booking your salon appointments.');
            }, 500);
        }

        // Skip the onboarding tour
        function skipOnboarding() {
            if (confirm('Are you sure you want to skip the tour? You can always restart it later.')) {
                // Save skip status - this also prevents it from showing again
                localStorage.setItem('sanwar_onboarding_completed', 'skipped');
                localStorage.setItem('sanwar_onboarding_skipped_at', new Date().toISOString());
                
                // Clean up any signup flags
                localStorage.removeItem('sanwar_just_signed_up');
                
                closeTour();
            }
        }

        // Close the tour
        function closeTour() {
            const overlay = document.getElementById('onboarding-overlay');
            const modal = document.getElementById('onboarding-modal');
            
            modal.classList.remove('active');
            
            setTimeout(() => {
                overlay.classList.remove('active');
                document.body.style.overflow = 'auto';
                tourStarted = false;
            }, 300);
        }

        // Handle overlay clicks (close tour when clicking outside modal)
        function handleOverlayClick(event) {
            if (event.target === document.getElementById('onboarding-overlay')) {
                skipOnboarding();
            }
        }

        // Keyboard navigation
        document.addEventListener('keydown', function(event) {
            if (!tourStarted) return;
            
            switch(event.key) {
                case 'ArrowRight':
                case 'Space':
                    event.preventDefault();
                    nextStep();
                    break;
                case 'ArrowLeft':
                    event.preventDefault();
                    previousStep();
                    break;
                case 'Escape':
                    event.preventDefault();
                    skipOnboarding();
                    break;
            }
        });

        // Auto-start tour for users who just signed up
        function checkAndStartOnboarding() {
            const hasCompletedOnboarding = localStorage.getItem('sanwar_onboarding_completed');
            const justSignedUp = localStorage.getItem('sanwar_just_signed_up');
            
            // Only show if user just signed up AND hasn't completed onboarding
            if (justSignedUp === 'true' && !hasCompletedOnboarding) {
                // Remove the "just signed up" flag to prevent showing again
                localStorage.removeItem('sanwar_just_signed_up');
                
                // Start tour after a brief delay
                setTimeout(startOnboardingTour, 1500);
            }
        }

        // Call this function when the page loads
        window.addEventListener('load', checkAndStartOnboarding);

        // Function to call after user signup (integrate this into your signup flow)
        function triggerOnboardingForNewUser() {
            // Set flag that user just signed up
            localStorage.setItem('sanwar_just_signed_up', 'true');
            
            // Start onboarding immediately or redirect to dashboard where it will auto-start
            checkAndStartOnboarding();
        }

        // Demo functions for testing
        function simulateSignup() {
            // Simulate what happens after a user signs up
            localStorage.setItem('sanwar_just_signed_up', 'true');
            alert('✅ Signup simulated! The onboarding tour will now start automatically.');
            
            // Small delay to show the alert first
            setTimeout(() => {
                checkAndStartOnboarding();
            }, 1000);
        }

        function resetOnboardingStatus() {
            // Reset all onboarding related localStorage items
            localStorage.removeItem('sanwar_onboarding_completed');
            localStorage.removeItem('sanwar_onboarding_completed_at');
            localStorage.removeItem('sanwar_onboarding_skipped_at');
            localStorage.removeItem('sanwar_just_signed_up');
            
            alert('🔄 Onboarding status reset! You can now test the signup flow again.');
        }
    </script>
</body>
</html>
